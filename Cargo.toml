[workspace]
members = ["rust/randomr", "rust/randomr-cli"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/pmarreck/random"

[workspace.dependencies]
blake3 = { version = "=1.8.5", default-features = false, features = ["pure", "zeroize"] }
getrandom = { version = "=0.4.3" }
libc = { version = "=0.2.177" }
zeroize = { version = "=1.8.2", default-features = false, features = ["derive"] }

# Release executables are distribution artifacts. Keep dev/test profiles rich
# enough to debug, but do not depend on a downstream packager to remove symbols.
[profile.release]
strip = "symbols"
